[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mft-parser"
version = "0.1.0"
description = "Local web app to process and visualise microfading tester (MFT) data"
readme = "README.md"
requires-python = ">=3.10"
classifiers = ["License :: OSI Approved :: The Unlicense (Unlicense)"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mft-parser = "mft_parser.__main__:main"

[tool.setuptools]
packages = ["mft_parser"]

[tool.setuptools.package-data]
mft_parser = ["static/*"]
