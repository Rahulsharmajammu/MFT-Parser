<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MFT-Parser</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/vendor/plotly.min.js"></script>
</head>
<body>
<aside id="sidebar">
  <header class="brand">
    <h1>MFT-Parser</h1>
    <span class="muted">Microfading data processor</span>
  </header>

  <section>
    <h2>Data</h2>
    <div id="dropzone" class="dropzone">
      Drop files or a folder here
      <div class="row">
        <label class="btn">Add folder<input id="folderInput" type="file" webkitdirectory multiple hidden></label>
        <label class="btn">Add files<input id="fileInput" type="file" accept=".txt" multiple hidden></label>
      </div>
    </div>
    <div id="loadStatus" class="muted small"></div>
    <details id="warningsBox" hidden><summary>Warnings</summary><ul id="warnings"></ul></details>
    <div class="row">
      <button id="saveSession" class="btn">Save session</button>
      <label class="btn">Load session<input id="sessionInput" type="file" accept=".json" hidden></label>
      <button id="clearAll" class="btn ghost">Clear</button>
    </div>
  </section>

  <section>
    <h2>Processing</h2>
    <div class="form">
      <label>X axis
        <select id="xAxis">
          <option value="dose">Dose (Mlux·h)</option>
          <option value="time">Time (s)</option>
          <option value="time_min">Time (min)</option>
        </select>
      </label>
      <label>Max dose (Mlux·h)
        <input id="maxDose" type="number" step="any" min="0" value="0.5">
      </label>
      <label>Smoothing
        <select id="smoothing">
          <option value="none">None</option>
          <option value="moving_average">Moving average</option>
          <option value="savgol">Savitzky–Golay</option>
        </select>
      </label>
      <label>Window (points)
        <input id="window" type="number" min="3" step="2" value="5">
      </label>
      <label id="polyLabel">Poly order
        <input id="polyorder" type="number" min="1" max="5" value="2">
      </label>
      <label>Average grid points
        <input id="avgPoints" type="number" min="2" placeholder="auto">
      </label>
    </div>
    <div class="seg" id="viewMode" role="radiogroup" aria-label="Display">
      <button data-v="raw">Replicates</button>
      <button data-v="mean">Mean ± SD</button>
      <button data-v="both">Both</button>
    </div>
  </section>

  <section>
    <h2>Charts</h2>
    <div id="metricToggles" class="chips"></div>
    <label class="inline">Columns
      <select id="columns"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
    </label>
  </section>

  <section>
    <div class="section-head">
      <h2>Groups</h2>
      <div class="row tight">
        <button id="autoGroup" class="btn small" title="Group measurements whose names differ only in the trailing replicate number">Auto-group</button>
        <button id="showAllGroups" class="btn small ghost">All</button>
        <button id="hideAllGroups" class="btn small ghost">None</button>
      </div>
    </div>
    <div id="groups"></div>
  </section>

  <section>
    <div class="section-head">
      <h2>Measurements</h2>
      <span id="selCount" class="muted small"></span>
    </div>
    <input id="filter" type="search" placeholder="Filter (text or /regex/)">
    <div class="row">
      <button id="newGroup" class="btn small primary">New group from selection</button>
      <select id="addToGroup" class="small"><option value="">Add selection to…</option></select>
    </div>
    <table id="measTable">
      <thead><tr><th><input type="checkbox" id="selectAll" title="Select all shown"></th><th>Measurement</th><th>Pts</th><th>Groups</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</aside>

<main>
  <nav class="tabs">
    <button data-tab="color" class="active">Colorimetry</button>
    <button data-tab="spectra">Spectra</button>
    <span class="spacer"></span>
    <button id="exportMean" class="btn">Export means CSV</button>
    <button id="exportRaw" class="btn">Export replicates CSV</button>
  </nav>
  <div id="legend" class="legend"></div>
  <div id="empty" class="empty">
    <p>Load MFT files, then select measurements and create groups to plot them.</p>
  </div>
  <div id="charts" class="charts"></div>
  <div id="spectra" class="charts" hidden></div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
